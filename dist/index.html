<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="为照片添加尼康拍摄信息边框，支持 EXIF 自动读取与批量导出，照片仅在本机处理。"><title>Nikon Frame</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css?v=8"><link rel="stylesheet" href="fonts.css"><script defer src="vendor/exifr.js"></script><script defer src="vendor/fflate.js"></script><script type="module" src="app.js?v=6"></script></head>
<body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">N</span><span>Nikon <b>Frame</b></span></a><span id="status" class="header-status" role="status" aria-live="polite">准备好记录下一张照片</span></header>
<main><div class="toolbar"><h1>照片边框</h1><div class="actions"><button id="add" class="primary">＋ 导入照片</button><button id="export-one" disabled>导出当前</button><button id="export-all" disabled>批量导出 <span id="total">0</span></button></div></div>
<input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
<div class="workspace"><aside class="rail"><div class="section-title"><span>照片</span><button class="text-button" id="clear" disabled>清空</button></div><div id="list" class="photo-list"><p class="list-empty">导入后在这里切换照片</p></div></aside>
<section class="stage" id="drop-zone" aria-label="照片预览"><div id="empty" class="empty"><svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><path d="M7 14h42v32H7z" stroke="currentColor" stroke-width="1.5"/><path d="m8 38 12-12 11 11 7-7 10 11M40 19h.01" stroke="currentColor" stroke-width="1.5"/><path d="M12 9h32" stroke="currentColor" stroke-width="1.5"/></svg><h2>让每张照片留下拍摄信息</h2><p>拖入照片，或点击导入</p><button id="empty-add">选择照片</button></div><div id="preview-wrap" hidden><canvas id="preview" aria-label="尼康边框预览"></canvas><div class="preview-caption"><span id="dimensions"></span><span>原图比例 · 尼康信息栏</span></div></div><div class="drop-overlay">松开以导入照片</div></section>
<aside class="editor"><div class="section-title">拍摄信息 <span id="exif-state" class="tag">等待导入</span></div><form id="metadata"><label>相机型号<input name="model" placeholder="例如 NIKON Z 8" maxlength="120" disabled></label><label class="lens-field">镜头型号<textarea name="lens" rows="2" placeholder="例如 AF-S NIKKOR 24-70mm f/2.8G ED" maxlength="200" disabled></textarea></label><label>拍摄时间<input name="date" placeholder="例如 2026.10.06 14:30:00" maxlength="40" disabled></label><label><span id="focal-label">焦距 / mm</span><input name="focal" type="number" min="0.1" max="10000" step="any" placeholder="—" disabled></label><div class="field-pair"><label>光圈 / f<input name="aperture" type="number" min="0.1" max="256" step="any" placeholder="—" disabled></label><label>ISO<input name="iso" type="number" min="1" max="10000000" step="1" placeholder="—" disabled></label></div><label>快门 / 秒<input name="shutter" placeholder="例如 1/250 或 2" maxlength="24" disabled></label><button type="button" id="reset" disabled>恢复 EXIF</button><div class="caption-field"><label>自定义句子<input name="caption" placeholder="影像从心" maxlength="80" disabled></label><button type="button" id="apply-caption" disabled>应用到全部</button></div></form><div id="brand-warning" class="warning" hidden><p>这张照片来自其他品牌</p><label class="check"><input id="brand-confirm" type="checkbox">仍使用尼康信息栏</label></div><p class="editor-note">缺失信息可补充，留空则隐藏。</p></aside></div>
<div id="progress-wrap" hidden><progress id="progress" max="100" value="0"></progress><button id="cancel" class="text-button">取消</button></div><div id="errors" class="errors" hidden role="alert"></div></main><footer><span>JPG · PNG · WebP</span><span>照片仅在本机处理</span><span>照片与信息在刷新后清除</span><span>NIKON FRAME · v6</span></footer></body></html>
